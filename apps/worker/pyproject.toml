[project]
name = "worker"
version = "0.1.0"
description = "skill-guard mass-analysis worker: ingest agent skills at scale, score with Jev, store results"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "skillguard",
    "sqlalchemy>=2.0.54",
]

[tool.uv.sources]
skillguard = { path = "../jev", editable = true }

[project.scripts]
worker = "worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv]
package = true
