[project]
name = "skillguard"
version = "0.1.0"
description = "Calibrated triage of agent-facing artifacts (Claude Code skills, MCP servers) using System One inference"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "numpy>=2.5.3",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "scikit-learn>=1.9.1",
  "typesafe-sdk>=0.7.0",
  "uvicorn[standard]>=0.53.0",
]

[project.scripts]
skill-guard = "skillguard.cli:main"
skillguard = "skillguard.cli:main"  # legacy alias

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillguard"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.1.1"]
